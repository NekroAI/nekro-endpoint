<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO Meta Tags -->
    <title>Endpoints - 在边缘发布与分享你的端点</title>
    <meta name="description" content="在 Cloudflare 全球边缘发布静态内容与代理端点，用权限组和通行卡控制访问。开源，可自托管。">
    <meta name="keywords" content="端点编排,Cloudflare,API端点,端点管理,权限控制,无服务器,边缘计算,Workers,端点平台,API管理">
    <meta name="author" content="NekroAI">
    <meta name="robots" content="index, follow">
    <meta name="language" content="zh-CN">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ep.nekro.ai">
    <meta property="og:title" content="Endpoints - 在边缘发布与分享你的端点">
    <meta property="og:description" content="在 Cloudflare 全球边缘发布静态内容与代理端点，用权限组和通行卡控制访问。开源，可自托管。">
    <meta property="og:image" content="https://ep.nekro.ai/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Endpoints">
    <meta property="og:locale" content="zh-CN">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://ep.nekro.ai">
    <meta name="twitter:title" content="Endpoints - 在边缘发布与分享你的端点">
    <meta name="twitter:description" content="在 Cloudflare 全球边缘发布静态内容与代理端点，用权限组和通行卡控制访问。开源，可自托管。">
    <meta name="twitter:image" content="https://ep.nekro.ai/og-image.png">
    
    
    <!-- Additional SEO -->
    <link rel="canonical" href="https://ep.nekro.ai">
    <meta name="theme-color" content="#0A0C10">
    <meta name="application-name" content="Endpoints">
    <meta name="apple-mobile-web-app-title" content="Endpoints">
    <meta name="msapplication-TileColor" content="#0A0C10">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Endpoints",
      "description": "在 Cloudflare 全球边缘发布静态内容与代理端点，用权限组和通行卡控制访问。开源，可自托管。",
      "url": "https://ep.nekro.ai",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://ep.nekro.ai/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Theme: applied before first paint so SSR output never flashes (docs/REDESIGN.md §3.4) -->
    <script>(function(){try{var m=localStorage.getItem('themeMode');if(m!=='light'&&m!=='dark'){m=m==='system'&&window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.dataset.theme=m}catch(e){document.documentElement.dataset.theme='dark'}})()</script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Stylesheets -->
    
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    
    <!-- Scripts -->
    <script type="module" crossorigin src="/src/entry-client.tsx"></script>
  </body>
</html>
